<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0f17" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="VibeOne" />
  <title>VibeOne</title>
  <link rel="manifest" href="/manifest.json?v=3" />
  <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png?v=3" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png?v=3" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=3" />

  <!-- Tailwind CSS (local vendor) -->
  <script src="/vendor/tailwindcss.min.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            bg: '#0b0f17',
            surface: '#111723',
            card: '#171f30',
            border: '#232f46',
          }
        }
      }
    };
  </script>

  <!-- marked.js, highlight.js & DOMPurify (local vendor) -->
  <link rel="stylesheet" href="/vendor/github-dark.min.css" />
  <script src="/vendor/purify.min.js"></script>
  <script src="/vendor/marked.min.js"></script>
  <script src="/vendor/highlight.min.js"></script>

  <link rel="stylesheet" href="/static/app.css" />
</head>
<body>
  <!-- Offline / Server Unreachable Overlay -->
  <div id="offline-overlay" class="fixed inset-0 z-50 hidden flex items-center justify-center bg-[#0b0f17]/95 backdrop-blur-md p-6">
    <div class="w-full max-w-sm rounded-2xl border border-border bg-surface p-6 shadow-2xl text-center space-y-4">
      <div class="flex flex-col items-center gap-3">
        <div class="relative">
          <img src="/icon-192.png?v=3" alt="VibeOne" class="w-12 h-12 rounded-2xl opacity-90" />
          <span class="absolute -right-1 -bottom-1 w-3.5 h-3.5 rounded-full bg-rose-500 ring-2 ring-surface"></span>
        </div>
        <div>
          <h1 class="text-base font-semibold text-white">无法连接服务器</h1>
          <p id="offline-detail" class="mt-1 text-xs text-slate-400 leading-relaxed">
            当前处于离线状态或服务器暂时不可达，恢复网络后将自动重连。
          </p>
        </div>
      </div>
      <button
        id="btn-offline-retry"
        type="button"
        class="w-full rounded-xl bg-blue-600 hover:bg-blue-500 active:scale-[0.99] transition py-3 text-sm font-medium text-white disabled:opacity-60"
      >
        重新连接
      </button>
    </div>
  </div>

  <!-- Auth Overlay -->
  <div id="auth-overlay" class="fixed inset-0 z-50 hidden flex items-center justify-center bg-[#0b0f17]/95 backdrop-blur-md p-6">
    <div class="w-full max-w-sm rounded-2xl border border-border bg-surface p-6 shadow-2xl">
      <div class="flex items-center justify-between gap-2 mb-4">
        <div class="flex items-center gap-3 min-w-0">
          <img src="/icon-192.png?v=3" alt="VibeOne" class="w-10 h-10 rounded-xl shrink-0" />
          <div class="min-w-0">
            <h1 class="text-lg font-semibold text-white">VibeOne</h1>
            <p class="text-xs text-slate-400">请输入访问密钥 (VIBEONE_WEB_TOKEN)</p>
          </div>
        </div>
        <div class="inline-flex items-center rounded-lg border border-border bg-bg p-0.5 shrink-0" data-i18n-skip="1">
          <button type="button" data-lang-choice="zh" class="px-2 py-1 rounded-md text-[11px] font-medium border border-transparent transition">中文</button>
          <button type="button" data-lang-choice="en" class="px-2 py-1 rounded-md text-[11px] font-medium border border-transparent transition">EN</button>
        </div>
      </div>
      <form id="auth-form" class="space-y-3" method="post" action="/api/auth">
        <input
          id="auth-username-input"
          type="text"
          name="username"
          value="vibeone"
          autocomplete="username"
          class="sr-only"
          tabindex="-1"
          aria-hidden="true"
        />
        <input
          id="auth-token-input"
          type="password"
          name="password"
          autocomplete="current-password"
          placeholder="输入访问密码..."
          class="w-full rounded-xl border border-border bg-bg px-3.5 py-3 text-sm text-white placeholder-slate-500 focus:border-blue-500 focus:outline-none"
          required
        />
        <p id="auth-error" class="hidden text-xs text-rose-400"></p>
        <button
          type="submit"
          class="w-full rounded-xl bg-blue-600 hover:bg-blue-500 active:scale-[0.99] transition py-3 text-sm font-medium text-white"
        >
          解锁并连接
        </button>
        <button
          id="btn-passkey-login"
          type="button"
          class="hidden w-full rounded-xl border border-emerald-500/40 bg-emerald-500/15 hover:bg-emerald-500/25 active:scale-[0.99] transition py-3 text-sm font-medium text-emerald-200 flex items-center justify-center gap-2"
        >
          <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 5.25a3 3 0 013 3m3 0a6 6 0 01-7.029 5.912c-.563-.097-1.159.026-1.563.43L10.5 17.25H8.25v2.25H6v2.25H2.25v-2.818c0-.597.237-1.17.659-1.591l6.499-6.499c.404-.404.527-1 .43-1.563A6 6 0 1121.75 8.25z"/></svg>
          <span>使用 Passkey / 面容解锁</span>
        </button>
      </form>
    </div>
  </div>

  <!-- Main Remote Control Shell (Left Sidebar + Main Chat Canvas) -->
  <div id="app">
    <!-- Mobile Sidebar Backdrop -->
    <div id="sidebar-backdrop" class="hidden fixed top-0 left-0 right-0 full-viewport-layer z-30 bg-black/65 backdrop-blur-[2px] lg:hidden"></div>

    <!-- Left Sidebar (Always open on Desktop >=1024px, slide-over drawer on Mobile) -->
    <aside
      id="sidebar"
      class="fixed top-0 left-0 full-viewport-layer z-40 w-[84vw] max-w-[300px] lg:static lg:h-full lg:w-[280px] lg:max-w-none shrink-0 bg-surface border-r border-border flex flex-col -translate-x-full lg:translate-x-0 transition-transform duration-200 ease-out"
    >
      <!-- Sidebar Brand Header -->
      <div class="safe-top px-3.5 pb-3 border-b border-border/80 flex items-center justify-between gap-2 shrink-0">
        <div class="flex items-center gap-2.5 min-w-0">
          <img src="/icon-192.png?v=3" alt="VibeOne" class="w-6 h-6 rounded-lg shrink-0" />
          <span class="text-sm font-semibold text-slate-100 truncate">VibeOne</span>
          <span id="conn-dot" class="w-2 h-2 rounded-full bg-amber-400 shrink-0" title="连接状态"></span>
        </div>
        <div class="flex items-center gap-1 shrink-0">
          <button
            id="btn-sidebar-refresh"
            type="button"
            class="p-1.5 rounded-lg hover:bg-card text-slate-400 hover:text-slate-200 active:scale-95"
            title="刷新会话列表"
          >
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0l3.181 3.183a8.25 8.25 0 0013.803-3.7M4.031 9.865a8.25 8.25 0 0113.803-3.7l3.181 3.182m0-4.991v4.99"/></svg>
          </button>
          <button
            id="btn-sidebar-close"
            type="button"
            class="lg:hidden p-1.5 rounded-lg hover:bg-card text-slate-400 hover:text-slate-200 active:scale-95"
            title="关闭侧边栏"
          >
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
          </button>
        </div>
      </div>

      <!-- Profile / Account Switcher -->
      <div id="sidebar-profile-section" class="px-3 py-2 border-b border-border/60 shrink-0 bg-bg/40">
        <button
          id="btn-profile-toggle"
          type="button"
          class="w-full flex items-center justify-between gap-2 px-2.5 py-1.5 rounded-xl border border-border/80 bg-bg hover:bg-card active:scale-[0.99] text-xs transition"
          title="切换 Antigravity 账号"
        >
          <span class="flex items-center gap-1.5 min-w-0">
            <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 shrink-0"></span>
            <span id="profile-current-label" class="text-slate-200 font-medium truncate">账号: 加载中...</span>
          </span>
          <span class="text-[10px] text-slate-400 shrink-0 flex items-center gap-0.5">
            <span>切换</span>
            <svg id="profile-chevron" class="w-3 h-3 transition-transform" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5"/></svg>
          </span>
        </button>
        <div id="profile-list" class="hidden mt-1.5 space-y-1"></div>
      </div>

      <!-- Sidebar Primary Actions + Search -->
      <div id="sidebar-actions-section" class="p-3 space-y-2 border-b border-border/60 shrink-0">
        <button
          id="btn-sidebar-new"
          type="button"
          class="w-full py-2 px-3 rounded-xl bg-blue-600 hover:bg-blue-500 active:scale-[0.98] text-xs font-medium text-white flex items-center justify-center gap-1.5 transition"
        >
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.3" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/></svg>
          <span>新建会话</span>
        </button>

        <input
          id="sidebar-search"
          type="search"
          placeholder="搜索当前账号的项目、会话或消息全文..."
          class="w-full rounded-xl border border-border/80 bg-bg px-3 py-1.5 text-xs text-slate-100 placeholder-slate-500 focus:border-blue-500 focus:outline-none"
        />
      </div>

      <!-- Project-Grouped Sessions List -->
      <div id="sidebar-sessions" class="flex-1 overflow-y-auto px-2 py-2.5 space-y-2">
        <div class="text-slate-500 text-xs text-center py-8">正在加载工作区与会话...</div>
      </div>

      <!-- Sidebar Footer: Context Usage & Settings -->
      <div id="sidebar-footer" class="safe-bottom px-3 pt-2 border-t border-border/80 flex items-center justify-between gap-2 text-[11px] shrink-0">
        <span id="sidebar-usage" class="text-slate-400 truncate">上下文: -</span>
        <button
          id="btn-sidebar-settings"
          type="button"
          class="px-2.5 py-1.5 rounded-xl border border-border/80 bg-bg hover:bg-card active:scale-95 text-slate-300 hover:text-slate-100 inline-flex items-center gap-1.5 transition shrink-0"
          title="打开设置"
        >
          <svg class="w-3.5 h-3.5 text-slate-400 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.324.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 011.37.49l1.296 2.247a1.125 1.125 0 01-.26 1.431l-1.003.827c-.293.24-.438.613-.431.992a6.759 6.759 0 010 .255c-.007.378.138.75.43.99l1.005.828c.424.35.534.954.26 1.43l-1.298 2.247a1.125 1.125 0 01-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.57 6.57 0 01-.22.128c-.331.183-.581.495-.644.869l-.213 1.28c-.09.543-.56.941-1.11.941h-2.594c-.55 0-1.02-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 01-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 01-1.369-.49l-1.297-2.247a1.125 1.125 0 01.26-1.431l1.004-.827c.292-.24.437-.613.43-.992a6.932 6.932 0 010-.255c.007-.378-.138-.75-.43-.99l-1.004-.828a1.125 1.125 0 01-.26-1.43l1.297-2.247a1.125 1.125 0 011.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.087.22-.128.332-.183.582-.495.644-.869l.214-1.281z"/>
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
          </svg>
          <span>设置</span>
        </button>
      </div>
    </aside>

    <!-- Main Chat Canvas -->
    <div class="flex-1 min-w-0 flex flex-col bg-bg">
      <!-- Clean Top Header -->
      <header class="safe-top shrink-0 border-b border-border bg-surface/90 backdrop-blur-md px-3 pb-2.5 flex items-center justify-between gap-2 z-20">
        <div class="flex items-center gap-2 min-w-0">
          <button
            id="btn-sidebar-open"
            type="button"
            class="lg:hidden p-1.5 -ml-1 rounded-lg border border-border/80 bg-card hover:bg-slate-800 active:scale-95 text-slate-200 shrink-0"
            title="打开会话与工作区列表"
          >
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5"/></svg>
          </button>

          <div class="min-w-0">
            <div class="flex items-center gap-1.5 min-w-0">
              <span id="session-title" class="text-sm font-semibold text-slate-100 truncate">VibeOne</span>
              <span id="busy-badge" class="hidden text-[10px] px-1.5 py-0.5 rounded-full bg-blue-500/20 text-blue-300 border border-blue-500/30 shrink-0">运行中</span>
              <button id="bg-tasks-badge" type="button" class="hidden text-[10px] px-1.5 py-0.5 rounded-full border shrink-0 inline-flex items-center gap-1 active:scale-95 transition" title="查看后台运行中的会话"></button>
            </div>
            <div class="flex items-center gap-1.5 min-w-0 mt-0.5">
              <span
                id="header-dir"
                class="inline-flex items-center gap-1 text-[11px] text-emerald-300/90 truncate max-w-full"
                title="当前工作目录"
              >
                <svg class="w-3 h-3 shrink-0 text-emerald-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M2.25 12.75V12A2.25 2.25 0 014.5 9.75h15A2.25 2.25 0 0121.75 12v.75m-8.69-6.44l-2.12-2.12a1.5 1.5 0 00-1.061-.44H4.5A2.25 2.25 0 002.25 6v12a2.25 2.25 0 002.25 2.25h15A2.25 2.25 0 0021.75 18V9a2.25 2.25 0 00-2.25-2.25h-5.379a1.5 1.5 0 01-1.06-.44z"/></svg>
                <span id="header-dir-label" class="truncate font-mono">正在连接...</span>
              </span>
              <span id="header-error" class="hidden text-[11px] text-rose-400 truncate"></span>
            </div>
          </div>
        </div>

        <div class="flex items-center gap-1.5 shrink-0">
          <button
            id="btn-diff"
            type="button"
            class="px-2.5 py-1.5 rounded-lg border border-border bg-card hover:bg-slate-800 active:scale-95 text-xs font-medium text-slate-200 flex items-center gap-1"
            title="查看当前目录 Git Diff"
          >
            <svg class="w-3.5 h-3.5 text-emerald-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"/></svg>
            <span>Diff</span>
          </button>

          <button
            id="btn-header-new"
            type="button"
            class="p-1.5 rounded-lg border border-border bg-card hover:bg-slate-800 active:scale-95 text-slate-200"
            title="在当前项目新建会话"
          >
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/></svg>
          </button>
        </div>
      </header>

      <!-- Chat Stream Area (wrapped so jump-to-bottom always sits cleanly above composer) -->
      <div class="relative flex-1 min-h-0 flex flex-col">
        <main id="chat-scroll" class="flex-1 overflow-y-auto px-3">
          <div id="chat-list" class="max-w-3xl mx-auto space-y-3 py-4 pb-6">
            <div id="empty-state" class="py-14 text-center space-y-3">
              <img src="/icon-192.png?v=3" alt="" class="w-12 h-12 mx-auto rounded-2xl opacity-90" />
              <div class="text-base font-semibold text-slate-100">Agy 远程控制已就绪</div>
              <div class="text-xs text-slate-400 max-w-xs mx-auto leading-relaxed">
                直接发送指令，或从左侧栏切换任意项目目录与历史会话。
              </div>
              <div class="pt-1 flex flex-col items-center gap-2.5">
                <button
                  id="btn-empty-sidebar"
                  type="button"
                  class="lg:hidden px-3.5 py-1.5 rounded-xl border border-border bg-card hover:bg-slate-800 active:scale-95 text-xs text-slate-200"
                >
                  打开项目与历史会话
                </button>
              </div>
            </div>
          </div>
        </main>

        <!-- Jump to bottom floating pill -->
        <button
          id="btn-scroll-bottom"
          type="button"
          class="hidden absolute right-4 bottom-3 z-20 px-3 py-1.5 rounded-full bg-surface/95 border border-border shadow-lg text-xs text-blue-300 hover:bg-card active:scale-95"
        >
          ↓ 回到最新
        </button>
      </div>

      <!-- Permission Approval Bar -->
      <section id="permission-bar" class="hidden shrink-0 border-t border-amber-500/40 bg-[#1a1610] px-3 py-2.5 z-20">
        <div id="permission-list" class="max-w-3xl mx-auto space-y-2"></div>
      </section>

      <!-- Remote Control Composer (Flush right above iOS home indicator, matching official Agy Remote Control) -->
      <footer class="composer-safe-bottom shrink-0 bg-bg/95 backdrop-blur-md px-3 pt-1.5 z-20">
        <div class="relative max-w-3xl mx-auto">
          <!-- Slash Command Palette (pops up above composer on `/` or toolbar tap) -->
          <div id="slash-palette" class="hidden absolute left-0 right-0 bottom-full mb-2 z-30 rounded-2xl border border-border bg-[#111723] shadow-2xl overflow-hidden max-h-64 flex flex-col">
            <div class="px-3 py-1.5 border-b border-border/70 flex items-center justify-between text-[11px] text-slate-400 shrink-0">
              <span>快捷指令 (/)</span>
              <span id="slash-count" class="text-slate-500"></span>
            </div>
            <div id="slash-list" class="overflow-y-auto p-1.5 space-y-0.5"></div>
          </div>

          <!-- Queued Follow-up Messages Bar (FIFO message queue per session) -->
          <div id="queue-bar" class="hidden mb-1.5 rounded-2xl border border-blue-500/35 bg-[#111723] shadow-lg overflow-hidden">
            <div class="px-3 py-1.5 border-b border-border/70 flex items-center justify-between gap-2 text-[11px]">
              <div class="flex items-center gap-1.5 text-blue-300 font-medium min-w-0">
                <span class="w-1.5 h-1.5 rounded-full bg-blue-400 animate-soft-pulse shrink-0"></span>
                <span id="queue-count" class="truncate">待发送队列 (0)</span>
              </div>
              <div class="flex items-center gap-1.5 shrink-0">
                <button id="btn-queue-run" type="button" class="hidden px-2 py-0.5 rounded-md bg-blue-600/80 hover:bg-blue-500 text-[10px] text-white font-medium active:scale-95 transition">继续执行</button>
                <button id="btn-queue-clear" type="button" class="px-1.5 py-0.5 rounded-md text-[10px] text-slate-400 hover:text-rose-300 hover:bg-rose-950/50 transition">清空</button>
              </div>
            </div>
            <div id="queue-list" class="max-h-36 overflow-y-auto divide-y divide-border/50"></div>
          </div>

          <div id="composer-card" class="rounded-2xl border border-border bg-surface focus-within:border-blue-500/70 transition shadow-lg">
            <!-- Active Quote Reply Banner -->
            <div id="quote-preview-bar" class="hidden px-2.5 pt-2">
              <div class="flex items-start gap-2 rounded-xl border border-blue-500/25 bg-[#0d1422] px-2.5 py-2">
                <span class="mt-0.5 w-[2.5px] self-stretch rounded-full bg-blue-400/90 shrink-0"></span>
                <button id="quote-preview-jump" type="button" class="flex-1 min-w-0 text-left group focus:outline-none" title="定位到原消息">
                  <div class="flex items-center gap-1 text-[11px] font-medium text-blue-300/95">
                    <svg class="w-3 h-3 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 15L3 9m0 0l6-6M3 9h12a6 6 0 010 12h-3"/></svg>
                    <span id="quote-preview-label">引用回复</span>
                  </div>
                  <div id="quote-preview-text" class="mt-0.5 text-xs text-slate-300/90 leading-snug line-clamp-2 break-words"></div>
                </button>
                <button id="btn-quote-clear" type="button" class="p-1 -mr-0.5 rounded-lg text-slate-400 hover:text-slate-100 hover:bg-card/80 active:scale-95 transition shrink-0" title="取消引用 (Esc)">
                  <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
              </div>
            </div>

            <!-- Pending Image Previews -->
            <div id="image-preview-row" class="hidden flex items-center gap-2 overflow-x-auto px-3 pt-2 pb-1"></div>

            <!-- Text Input -->
            <textarea
              id="prompt-input"
              rows="1"
              placeholder="发指令、粘贴或拖入图片，输入 / 呼出命令..."
              class="w-full resize-none bg-transparent px-3 pt-2.5 pb-1 text-[15px] leading-snug text-slate-100 placeholder-slate-500 focus:outline-none max-h-36 overflow-y-auto"
            ></textarea>

            <!-- Inline Controls Toolbar (Clean: Upload, Model/Level, Mode, Merged Send/Stop) -->
            <div class="px-2 pb-1.5 pt-0.5 flex items-center justify-between gap-1.5">
              <div class="flex items-center gap-1.5 min-w-0 flex-1 overflow-x-auto">
                <input id="image-input" type="file" accept="image/*" multiple class="hidden" />
                <button
                  id="btn-upload"
                  type="button"
                  class="shrink-0 w-8 h-8 rounded-xl hover:bg-card active:scale-95 flex items-center justify-center text-slate-300 hover:text-white transition"
                  title="上传图片 / 拍照"
                >
                  <svg class="w-[18px] h-[18px]" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 15.75l5.159-5.159a2.25 2.25 0 013.182 0l5.159 5.159m-1.5-1.5l1.409-1.409a2.25 2.25 0 013.182 0l2.909 2.909M3.75 19.5h16.5a1.5 1.5 0 001.5-1.5V6a1.5 1.5 0 00-1.5-1.5H3.75A1.5 1.5 0 002.25 6v12a1.5 1.5 0 001.5 1.5zm10.5-11.25h.008v.008h-.008V8.25zm.375 0a.375.375 0 11-.75 0 .375.375 0 01.75 0z"/>
                  </svg>
                </button>

                <!-- 2-Level Model Picker Pill -->
                <button
                  id="btn-model"
                  type="button"
                  class="max-w-[205px] sm:max-w-[260px] h-8 px-2.5 rounded-xl border border-border/80 bg-bg hover:bg-card active:scale-[0.98] inline-flex items-center gap-1 text-xs text-slate-200 transition min-w-0 shrink"
                  title="切换模型与思考档位"
                >
                  <svg class="w-3.5 h-3.5 shrink-0 text-blue-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9.813 15.904L9 18.75l-.813-2.846a4.5 4.5 0 00-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 003.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 003.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 00-3.09 3.09z"/></svg>
                  <span id="btn-model-label" class="truncate">模型</span>
                  <svg class="w-3 h-3 shrink-0 text-slate-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5"/></svg>
                </button>

                <!-- Execution Mode Pill -->
                <select
                  id="mode-select"
                  title="执行模式"
                  class="h-8 max-w-[106px] rounded-xl border border-border/80 bg-bg hover:bg-card px-2 text-xs text-slate-300 focus:outline-none focus:border-blue-500 shrink-0"
                ></select>
              </div>

              <!-- Merged Send / Stop Action Button -->
              <div class="flex items-center shrink-0">
                <button
                  id="btn-send"
                  type="button"
                  data-action="send"
                  class="w-8 h-8 rounded-xl bg-blue-600 hover:bg-blue-500 active:scale-95 flex items-center justify-center text-white disabled:opacity-40 transition"
                  title="发送 (Shift+Enter)"
                >
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 10.5L12 3m0 0l7.5 7.5M12 3v18"/>
                  </svg>
                </button>
              </div>
            </div>
          </div>
        </div>
      </footer>
    </div>
  </div>
