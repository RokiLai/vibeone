  <!-- Directory Picker Modal (Clean, Single-Purpose) -->
  <div id="dir-modal" class="hidden fixed top-0 left-0 right-0 full-viewport-layer z-50 bg-black/75 backdrop-blur-sm flex flex-col justify-end sm:justify-center sm:items-center">
    <div class="w-full sm:max-w-xl h-[85dvh] sm:h-[78dvh] bg-surface border-t sm:border border-border rounded-t-2xl sm:rounded-2xl flex flex-col overflow-hidden shadow-2xl">
      <div class="px-4 py-3 border-b border-border flex items-center justify-between gap-2 shrink-0">
        <div class="min-w-0">
          <div class="text-sm font-semibold text-white">选择工作目录新建会话</div>
          <div class="text-[11px] text-slate-400">浏览本机目录，选择目标项目并开启会话</div>
        </div>
        <button id="btn-dir-close" type="button" class="px-2.5 py-1 rounded-lg bg-slate-800 text-xs text-slate-200 hover:bg-slate-700 shrink-0">关闭</button>
      </div>

      <!-- Shortcuts -->
      <div id="dir-shortcuts" class="px-3 pt-2.5 pb-1.5 flex items-center gap-1.5 overflow-x-auto shrink-0"></div>

      <!-- Manual Path Bar -->
      <form id="dir-path-form" class="px-3 py-1.5 flex items-center gap-1.5 shrink-0">
        <input
          id="dir-path-input"
          type="text"
          placeholder="/path/to/project"
          class="flex-1 min-w-0 rounded-xl border border-border bg-bg px-3 py-1.5 text-xs font-mono text-slate-100 placeholder-slate-500 focus:border-blue-500 focus:outline-none"
        />
        <button type="submit" class="px-3 py-1.5 rounded-xl border border-border bg-card hover:bg-slate-800 text-xs text-slate-200 shrink-0">前往</button>
      </form>

      <!-- Browser Controls -->
      <div class="px-3 py-1.5 border-b border-border/60 flex items-center justify-between gap-2 text-xs shrink-0">
        <div class="flex items-center gap-1.5 min-w-0">
          <button id="btn-dir-up" type="button" class="px-2 py-1 rounded-lg border border-border bg-bg hover:bg-card text-slate-200 disabled:opacity-40 shrink-0">
            ↑ 上级
          </button>
          <span id="dir-current-badge" class="text-[11px] text-slate-400 truncate"></span>
        </div>
        <div class="flex items-center gap-1.5 shrink-0">
          <button id="btn-dir-hidden" type="button" class="px-2 py-1 rounded-lg border border-border bg-bg hover:bg-card text-[11px] text-slate-400">
            隐藏目录
          </button>
          <button id="btn-dir-mkdir" type="button" class="px-2 py-1 rounded-lg border border-border bg-bg hover:bg-card text-[11px] text-blue-300">
            ＋ 新建目录
          </button>
        </div>
      </div>

      <!-- Subdirectories List -->
      <div id="dir-list" class="flex-1 overflow-y-auto p-3 space-y-1.5"></div>

      <!-- Sticky CTA Footer -->
      <div class="safe-bottom px-3 pt-2.5 border-t border-border bg-surface shrink-0 space-y-1.5">
        <div id="dir-cta-path" class="text-[11px] font-mono text-slate-400 truncate px-0.5"></div>
        <button
          id="btn-dir-create-session"
          type="button"
          class="w-full py-2.5 px-4 rounded-xl bg-blue-600 hover:bg-blue-500 active:scale-[0.99] text-sm font-medium text-white transition flex items-center justify-center gap-1.5"
        >
          <span>＋ 在当前目录创建新会话</span>
        </button>
      </div>
    </div>
  </div>

  <!-- 2-Level Model Picker Modal (Model -> Level) -->
  <div id="model-modal" class="hidden fixed top-0 left-0 right-0 full-viewport-layer z-50 bg-black/75 backdrop-blur-sm flex flex-col justify-end sm:justify-center sm:items-center">
    <div class="w-full sm:max-w-md max-h-[82dvh] bg-surface border-t sm:border border-border rounded-t-2xl sm:rounded-2xl flex flex-col overflow-hidden shadow-2xl">
      <div class="px-4 py-3 border-b border-border flex items-center justify-between gap-2 shrink-0">
        <div class="flex items-center gap-2 min-w-0">
          <button
            id="btn-model-back"
            type="button"
            class="hidden p-1 -ml-1 rounded-lg hover:bg-card text-slate-300 hover:text-white active:scale-95 shrink-0"
            title="返回模型列表"
          >
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5"/></svg>
          </button>
          <span id="model-modal-title" class="text-sm font-semibold text-white truncate">选择模型</span>
          <span id="model-count" class="text-[11px] px-2 py-0.5 rounded-full bg-card border border-border text-slate-300 shrink-0">0</span>
        </div>
        <button id="btn-model-close" type="button" class="px-2.5 py-1 rounded-lg bg-slate-800 text-xs text-slate-200 hover:bg-slate-700 shrink-0">关闭</button>
      </div>
      <div id="model-search-wrap" class="px-3 pt-2.5 pb-2 border-b border-border/60 shrink-0">
        <input
          id="model-search"
          type="search"
          placeholder="搜索模型名称或 ID..."
          class="w-full rounded-xl border border-border bg-bg px-3 py-2 text-xs text-slate-100 placeholder-slate-500 focus:border-blue-500 focus:outline-none"
        />
      </div>
      <div id="model-list" class="flex-1 overflow-y-auto p-3 space-y-1.5 safe-bottom"></div>
    </div>
  </div>

  <!-- Git Diff Modal -->
  <div id="diff-modal" class="hidden fixed top-0 left-0 right-0 full-viewport-layer z-50 bg-black/75 backdrop-blur-sm flex flex-col justify-end sm:justify-center sm:items-center">
    <div class="w-full sm:max-w-3xl h-[88dvh] sm:h-[82dvh] bg-surface border-t sm:border border-border rounded-t-2xl sm:rounded-2xl flex flex-col overflow-hidden shadow-2xl">
      <div class="px-4 py-3 border-b border-border flex items-center justify-between gap-2 shrink-0">
        <div class="min-w-0">
          <div class="text-sm font-semibold text-white flex items-center gap-2">
            <span>Git Diff</span>
            <span id="diff-branch" class="text-[11px] px-2 py-0.5 rounded-full bg-card border border-border text-blue-300 font-normal"></span>
          </div>
          <div id="diff-workdir" class="text-[11px] text-slate-400 truncate"></div>
        </div>
        <div class="flex items-center gap-2 shrink-0">
          <button id="btn-diff-refresh" type="button" class="px-2.5 py-1 rounded-lg border border-border bg-card text-xs text-slate-200 hover:bg-slate-800">刷新</button>
          <button id="btn-diff-close" type="button" class="px-2.5 py-1 rounded-lg bg-slate-800 text-xs text-slate-200 hover:bg-slate-700">关闭</button>
        </div>
      </div>
      <div id="diff-content" class="flex-1 overflow-auto p-3 font-mono text-xs leading-relaxed selectable-text"></div>
    </div>
  </div>

  <!-- File Preview Modal -->
  <div id="file-preview-modal" class="hidden fixed top-0 left-0 right-0 full-viewport-layer z-50 bg-black/75 backdrop-blur-sm flex flex-col justify-end sm:justify-center sm:items-center">
    <div class="w-full sm:max-w-4xl h-[88dvh] sm:h-[84dvh] bg-surface border-t sm:border border-border rounded-t-2xl sm:rounded-2xl flex flex-col overflow-hidden shadow-2xl">
      <div class="px-4 py-3 border-b border-border flex items-center justify-between gap-2 shrink-0">
        <div class="min-w-0 flex-1">
          <div class="flex items-center gap-1.5 min-w-0">
            <svg class="w-4 h-4 text-blue-400 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m2.25 0H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z"/></svg>
            <span id="file-preview-name" class="text-sm font-semibold text-white truncate">文件预览</span>
            <span id="file-preview-lang" class="hidden text-[10px] px-1.5 py-0.5 rounded-full bg-card border border-border text-blue-300 font-mono uppercase shrink-0"></span>
            <span id="file-preview-range" class="hidden text-[10px] px-1.5 py-0.5 rounded-full bg-blue-500/20 border border-blue-400/35 text-blue-200 font-mono shrink-0"></span>
          </div>
          <div class="flex items-center gap-2 mt-0.5 min-w-0">
            <button id="file-preview-path" type="button" class="text-[11px] font-mono text-slate-400 hover:text-slate-200 truncate text-left" title="点击复制完整路径"></button>
            <span id="file-preview-meta" class="text-[10px] text-slate-500 shrink-0"></span>
          </div>
        </div>
        <div class="flex items-center gap-1.5 shrink-0">
          <button id="btn-file-preview-md-toggle" type="button" class="hidden px-2 py-1 rounded-lg border border-border bg-card text-xs text-blue-300 hover:bg-slate-800 active:scale-95 transition">源码</button>
          <button id="btn-file-preview-wrap" type="button" class="hidden sm:inline-flex px-2 py-1 rounded-lg border border-border bg-card text-xs text-slate-300 hover:bg-slate-800 active:scale-95 transition" title="切换自动换行">换行</button>
          <button id="btn-file-preview-copy" type="button" class="px-2 py-1 rounded-lg border border-border bg-card text-xs text-slate-200 hover:bg-slate-800 active:scale-95 transition">复制</button>
          <button id="btn-file-preview-refresh" type="button" class="px-2 py-1 rounded-lg border border-border bg-card text-xs text-slate-200 hover:bg-slate-800 active:scale-95 transition">刷新</button>
          <button id="btn-file-preview-close" type="button" class="px-2.5 py-1 rounded-lg bg-slate-800 text-xs text-slate-200 hover:bg-slate-700 active:scale-95 transition">关闭</button>
        </div>
      </div>
      <div id="file-preview-banner" class="hidden px-4 py-1.5 border-b border-amber-500/30 bg-amber-950/35 text-[11px] text-amber-200 shrink-0"></div>
      <div id="file-preview-content" class="flex-1 overflow-auto bg-[#0b1120] selectable-text safe-bottom"></div>
    </div>
  </div>
